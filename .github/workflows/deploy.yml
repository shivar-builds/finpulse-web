name: GCS + Cloud CDN Multi-Environment Pipeline

on:
    push:
        branches:
            - develop
            - qa
            - "release/**"
            - main

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            # Map branch to target environment, bucket, and backend bucket
            - name: Resolve Environment Configuration
              run: |
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "ENV_NAME=production" >> $GITHUB_ENV
                    echo "BUCKET_NAME=finpulse-web-prod" >> $GITHUB_ENV
                    echo "BACKEND_BUCKET=finpulse-backend-prod" >> $GITHUB_ENV
                  elif [[ "${{ github.ref_name }}" == release/* ]]; then
                    echo "ENV_NAME=staging" >> $GITHUB_ENV
                    echo "BUCKET_NAME=finpulse-web-stage" >> $GITHUB_ENV
                    echo "BACKEND_BUCKET=finpulse-backend-stage" >> $GITHUB_ENV
                  elif [ "${{ github.ref_name }}" = "qa" ]; then
                    echo "ENV_NAME=qa" >> $GITHUB_ENV
                    echo "BUCKET_NAME=finpulse-web-qa" >> $GITHUB_ENV
                    echo "BACKEND_BUCKET=finpulse-backend-qa" >> $GITHUB_ENV
                  else
                    echo "ENV_NAME=development" >> $GITHUB_ENV
                    echo "BUCKET_NAME=finpulse-web-dev" >> $GITHUB_ENV
                    echo "BACKEND_BUCKET=finpulse-backend-dev" >> $GITHUB_ENV
                  fi

            - name: Build Application
              run: npm run build -- --configuration=${{ env.ENV_NAME }}

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            # Sync static build output to the target GCS bucket
            - name: Deploy Static Files to GCS Bucket
              run: |
                  gcloud storage rsync -r --delete-unmatched-destination-objects gs://${{ env.BUCKET_NAME }}

            # Invalidate Cloud CDN cache so users immediately get updated assets
            - name: Invalidate CDN Cache
              run: |
                  gcloud compute url-maps invalidate-cache ${{ env.BACKEND_BUCKET }} --path="/*"
